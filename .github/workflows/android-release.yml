name: Signed Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  release-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 37
        run: yes | sdkmanager "platforms;android-37" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Restore signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.VERBANODE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || (echo "Missing VERBANODE_KEYSTORE_BASE64" && exit 1)
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/verbanode-release.jks"
      - name: Build signed release APK
        env:
          VN_KEYSTORE_PATH: ${{ runner.temp }}/verbanode-release.jks
          VN_KEYSTORE_PASSWORD: ${{ secrets.VERBANODE_KEYSTORE_PASSWORD }}
          VN_KEY_ALIAS: ${{ secrets.VERBANODE_KEY_ALIAS }}
          VN_KEY_PASSWORD: ${{ secrets.VERBANODE_KEY_PASSWORD }}
        run: gradle --no-daemon clean testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: VerbaNode-Android-v0.4.4-release-apk
          path: app/build/outputs/apk/release/app-release.apk
