name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK 37
        shell: bash
        run: |
          set -euo pipefail
          SDK_PACKAGES="$(sdkmanager --list --include_obsolete)"
          if grep -Fq "platforms;android-37.0" <<<"$SDK_PACKAGES"; then
            PLATFORM_PACKAGE="platforms;android-37.0"
            PLATFORM_DIR="android-37.0"
          elif grep -Fq "platforms;android-37" <<<"$SDK_PACKAGES"; then
            PLATFORM_PACKAGE="platforms;android-37"
            PLATFORM_DIR="android-37"
          else
            echo "Android SDK platform 37 is not available from this runner's sdkmanager repository." >&2
            sdkmanager --list --include_obsolete | grep -E "platforms;android-(36|37)" || true
            exit 1
          fi
          sdkmanager "$PLATFORM_PACKAGE" "build-tools;37.0.0"
          test -f "$ANDROID_HOME/platforms/$PLATFORM_DIR/android.jar"
          test -x "$ANDROID_HOME/build-tools/37.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/37.0.0/aapt"
          echo "Installed $PLATFORM_PACKAGE with Build Tools 37.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Run JVM unit tests
        run: ./gradlew --no-daemon clean testDebugUnitTest --stacktrace
      - name: Upload unit-test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VerbaNode-Android-v0.5.4-unit-test-reports
          path: |
            app/build/test-results/testDebugUnitTest/**
            app/build/reports/tests/testDebugUnitTest/**
          if-no-files-found: warn
      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug --stacktrace
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: VerbaNode-Android-v0.5.4-lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: warn
      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug --stacktrace
      - name: R8 and resource-shrinking smoke build
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon assembleMinifiedRelease --stacktrace
          SMOKE_APK="$(find app/build/outputs/apk/minifiedRelease -type f -name '*.apk' -print -quit)"
          test -n "$SMOKE_APK"
          test -s "$SMOKE_APK"
          BADGING="$("$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "$SMOKE_APK")"
          grep -Fq "package: name='com.verbanode.mobile'" <<<"$BADGING"
          grep -Fq "versionCode='33'" <<<"$BADGING"
          grep -Fq "versionName='0.5.4'" <<<"$BADGING"
          echo "Minified smoke APK verified: $SMOKE_APK"
      - uses: actions/upload-artifact@v7
        with:
          name: VerbaNode-Android-v0.5.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
